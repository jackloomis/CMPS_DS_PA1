// 1. What is the worst case complexity of the following function?

function hasDuplicates(arr) {
  for (var i = 0; i < arr.length; i++) {
    for (var j = 0; j < arr.length; j++) {
      if (i !== j && arr[i] === arr[j]) {
        return true;
      }
    }
  }
  return false;
}

// The worst case complexity would be O(n^2) in the case where the algorithm needs to compare 
// every element against each other to check for duplicates.



// 2. Implement a faster version of the same function and analyze the
//    complexity of this approach.

function hasDuplicatesFast(arr) {
  let uniqueNums = new Set(arr);
  if (uniqueNums.size !== arr.length) {
    return true;
  }
  return false;
}

// By using a set to store the non-duplicate values, the nested loop can be avoided which reduces
// the complexity from O(n^2) to O(n). Populating the set is O(n) complexity, while the size comparison 
// is O(1) complexity.

function Dictionary() {
  this.items = {};
}

  Dictionary.prototype.ValuePair = function(key, value) {
    this.key = key;
    this.value = value;
    this.toString = function(){
      return `[#${this.key}: ${this.value}]`;
    }
  }

  Dictionary.prototype.defaultToString = function(item) {
    if (item === null) {
      return "NULL";
    }
    else if (item === undefined) {
      return "UNDEFINED";
    }
    else if (typeof item === "string" || item instanceof String) {
      return `${item}`;
    }
    return item.toString();
  };

  Dictionary.prototype.set = function(key, value) {
    if (key !== null && value !== null) {
      const itemKey = this.defaultToString(key);
      this.items[itemKey] = new this.ValuePair(key, value);
      return true;
    }
    return false;
  };

  Dictionary.prototype.delete = function(key) {
    if (this.has(key)) {
      const itemKey = this.defaultToString(key);
      delete this.items[itemKey];
      return true;
    }
    return false;
  };

  Dictionary.prototype.has = function(key) {
    return this.items[this.defaultToString(key)] !== undefined;
  };

  Dictionary.prototype.get = function(key) {
    const valueKey = this.items[this.defaultToString(key)];
    return valueKey === undefined ? undefined : valueKey.value;
  };

  Dictionary.prototype.clear = function() {
    this.items = {};
  };

  Dictionary.prototype.size = function() {
    return Object.keys(this.items).length;
  };

  Dictionary.prototype.keys = function() {
    return Object.keys(this.items);
  };

  Dictionary.prototype.values = function() {
    return Object.values(this.items);
  };

  Dictionary.prototype.getItems = function() {
    return this.items;
  };



function Graph(directed = false) {
  this.vertices = [];
  this.isDirected = directed;
  this.adjList = new Dictionary();
}

  Graph.prototype.addVertex = function(v) {
    if (!this.vertices.includes(v)) {
      this.vertices.push(v);
      this.adjList.set(v, []);
    }
  };

  Graph.prototype.addEdge = function(v, w, weight) {
    if (!this.adjList.get(v)) {
      this.addVertex(v);
    }
    if (!this.adjList.get(w)) {
      this.addVertex(w);
    }
    this.adjList.get(v).push({node: w, weight: weight});
    if (!this.isDirected) {
      this.adjList.get(w).push({node: v, weight: weight});
    }
  };

  Graph.prototype.getVertices = function() {
    return this.vertices;
  };

  Graph.prototype.getWeight = function(v, w) {
    let neighbors = this.adjList.get(v);
    if (!neighbors) {
      return Infinity;
    } else {
      let edge = neighbors.find(function(edge) {
        return edge.node === w;
      });
      if (edge) {
        return edge.weight;
      } else {
        return Infinity;
      }
    }
  };


const cityGraph = new Graph();

function greedySearch(start) {
  let cities = cityGraph.getVertices();
  let visited = [start];
  let remaining = cities.filter(function(city) {
    return city !== start;
  });

  let path = [start];
  let totalDistance = 0;
  let current = start;

  // Find closest city until remaining array is empty
  while (remaining.length > 0) {
    let closest = null;
    let minDistance = Infinity;

    for (let i = 0; i < remaining.length; i++) {
      let next = remaining[i];
      let distance = cityGraph.getWeight(current, next);
      
      if (distance < minDistance) {
        minDistance = distance;
        closest = next;
      }
    }
    visited.push(closest);
    path.push(closest);
    totalDistance += minDistance;
    current = closest;

    remaining = remaining.filter(function(city) {
      return city !== closest;
    });
  }
  // Add distance from final city back to starting point
  totalDistance += cityGraph.getWeight(current, start);
  path.push(start);

  // Print path and distance
  console.log("Path: " + path.join());
  console.log("Distance: " + totalDistance + " miles");
}


// First test starting from Pittsburgh
// Produces a logical route, first going north to Erie and then working its way east through State College, Harrisburg, and Philadelphia

// 4. Solve https://csacademy.com/contest/interview-archive/task/intersecting-rectangles/
//    What is the runtime complexity of your solution?

function createRectangle(x1, y1, x2, y2) {
  return { x1, y1, x2, y2 };
}

function intersect(a, b) {
  return a.x1 < b.x2 && b.x1 < a.x2 &&
         a.y1 < b.y2 && b.y1 < a.y2;
}

function countIntersects(rectangleArr) {
  let intersects = 0;

  for (let i = 0; i < rectangleArr.length; i++) {
    for (let j = i + 1; j < rectangleArr.length; j++) {
      if (intersect(rectangleArr[i], rectangleArr[j])) {
        intersects++;
      }
    }
  }
  return intersects;
}
