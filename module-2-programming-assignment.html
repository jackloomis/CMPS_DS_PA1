console.log("The stack data structure");

// 1. Implement the stack data structure described in the book. Instead of
//    using 'let items = [];' use 'var items = []'. Note that this
//    implementation does not use the prototype (see project).

function Stack() {
  var items = [];

  this.push = function(element) {
    items.push(element);
  }
  this.pop = function() {
    if (items.length === 0) {
      return undefined;
    }

    return items.pop();
  }
  this.peek = function() {
    return items[items.length - 1];
  }
  this.isEmpty = function() {
    return items.length === 0;
  }
  this.clear = function() {
    items.length = 0;
    console.log("Stack cleared.");
  }
  this.size = function() {
    return items.length;
  }
}

console.log(`${vehicleTypeArray.length} elements added to the stack.`);

// 2. The algorithm in (1) can be used to convert a decimal number to a binary
//    number but there is one issue. What is the problem?

//    The numbers are returned in reverse order so, by instead storing them in a stack, they can be retrieved in the correct order.

// 3. Solve the problem in (2) using a stack.

function decimalToBinary(decimalNum) {
  let remainderStack = new Stack();
  let num = decimalNum;
  let rem;
  let binString = "";

  while (num > 0) {
    rem = Math.floor(num % 2);
    remainderStack.push(rem);
    num = Math.floor(num / 2);
  }

  while (!remainderStack.isEmpty()) {
    binString += remainderStack.pop().toString();
  }
  return binString;
}

let binaryNum = decimalToBinary(decimalNum);
console.log(`${decimalNum} converted to binary is ${binaryNum}`);

//------------------//

console.log("Creating a queue");

// 1. Implement the queue data structure described in the book. Instead of
//    using 'let items = [];' use 'var items = []'. Note that this
//    implementation does not use the prototype (see project).

function Queue() {
  var items = [];

  this.enqueue = function(element) {
    items.push(element);
  }
  this.dequeue = function() {
    if (this.isEmpty()) {
      return undefined;
    }
    return items.shift();
  }
  this.peek = function() {
    if (this.isEmpty()) {
      return undefined;
    }
    return items[0];
  }
  this.isEmpty = function() {
    return items.length === 0;
  }
  this.clear = function() {
    items.length = 0;
    console.log("Queue cleared.");
  }
  this.size = function() {
    return items.length;
  }
}

// The priority queue //

console.log("The priority queue");

// The following class is used below.

function QueueElement(element, priority) {
  this.element = element;
  this.priority = priority;
}

// 1. Finish the implementation below for the priority queue. Note that this
//    implementation does not use the prototype.
function PriorityQueue() {
  var items = [];

    this.enqueue = function(element, priority) {
      var queueElement = new QueueElement(element, priority);
//  Loop through and compare priority number of element. If lower than any of the existing elements in the array, splice at that position without deleting any values and return to caller
      for (let i = 0; i < items.length; i++) {
        if (queueElement.priority < items[i].priority) {
          items.splice(i, 0, queueElement);
          return;
          }
        }
//  If priority number is higher than all existing elements, push to end of queue
      items.push(queueElement);
    }

    this.dequeue = function() {
      if (this.isEmpty()) {
        return undefined;
      }

//  Shift removes the front element of the array which works for dequeue in a priority queue
      return items.shift();
    }

    this.peek = function() {
      if (this.isEmpty()) {
        return undefined;
      }
      return items[0];
    } 

    this.isEmpty = function() {
      return (items.length === 0);
    }

    this.clear = function() {
      items.length = 0;
      console.log("Queue cleared.");
    }

    this.size = function() {
      return items.length;
    }

//  This is a helper function that is useful for printing
    this.print = function() {
      for (var i = 0; i < items.length; i++) {
        console.log(`${items[i].element} - ${items[i].priority}`);
      }
    };
  }

// 1. Finish the implementation for the hot potato game. nameList contains the
//    names of the participants, and num is how many times the potato is passed
//    before a participant is ejected from the game (the one that holds the
//    potato). Note that this is effectively a simulation of the game.

function hotPotato(nameList, num) {
  let queue = new Queue();
  let elimList = [];

  // add the names to the queue
  for (let i = 0; i < nameList.length; i++) {
    queue.enqueue(nameList[i]);
  }

  // while there is more than one name in the queue
  // dequeue and enqueue a name num times
  while (queue.size() > 1) {
    for (let i = 0; i < num; i++) {
      queue.enqueue(queue.dequeue());
    }
  // then dequeue one more time, which is the participant that is ejected
    elimList.push(queue.dequeue());
  }
  // /while (end of while loop)

  // the person that remains in the queue wins
  return {
    eliminated: elimList,
    winner: queue.dequeue()
  };
}
