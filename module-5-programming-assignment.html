console.log("The binary and binary search trees");

function BinarySearchTree() {
  function Node(key) {
    this.key = key;
    this.left = null;
    this.right = null
  }

  // the root node
  var root = null;

  // helper functions
  function insertNode(node, newNode) {
    if (newNode.key < node.key) {
      // go to left
      if (node.left === null) {
        // no left node yet so assign
        node.left = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.left, newNode);
      }
    }
    else {
      // go to right
      if (node.right === null) {
        // no right node yet so assign
        node.right = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.right, newNode);
      }
    }
  }

  function inOrderTraverseNode(node, callback) {
    if (node != null) {
      inOrderTraverseNode(node.left, callback);
      callback(node.key);
      inOrderTraverseNode(node.right, callback);
    }
  }

  function preOrderTraverseNode(node, callback) {
    if (node != null) {
      callback(node.key);
      preOrderTraverseNode(node.left, callback);
      preOrderTraverseNode(node.right, callback);
    }
  }

  function postOrderTraverseNode(node, callback) {
    if (node != null) {
      postOrderTraverseNode(node.left, callback);
      postOrderTraverseNode(node.right, callback);
      callback(node.key);
    }
  }
  
  function minNode(node) {
    let current = node;
    while (current != null && current.left != null) {
      current = current.left;
    }
    return current;
  }

  function maxNode(node) {
    let current = node;
    while (current != null && current.right != null) {
      current = current.right;
    }
    return current;
  }

  function searchNode(node, key) {
    if (node == null) {
      return false;
    }
    if (key < node.key) {
      return searchNode(node.left, key);
    }
    else if (key > node.key) {
      return searchNode(node.right, key);
    }
    else {
      return true;
    }
  }

  function removeNode(node, key) {
    if (node == null) {
      return null;
    }
    if (key < node.key) {
      node.left = removeNode(node.left, key);
      return node;
    }
    else if (key > node.key) {
      node.right = removeNode(node.right, key);
      return node;
    }
    else {
      // case 1
      if (node.left == null && node.right == null) {
        node = null;
        return node;
      }
      // case 2
      if (node.left == null) {
        node = node.right;
        return node;
      }
      else if (node.right == null) {
        node = node.left;
        return node;
      }
      // case 3
      const aux = minNode(node.right);
      node.key = aux.key;
      node.right = removeNode(node.right, aux.key);
      return node;
    }
  }


  this.insert = function(key) {
    // insert new key in the tree
    var newNode = new Node(key);
    if (root === null) {
      // no nodes yet
      root = newNode;
    }
    else {
      // find insert location through insertNode
      insertNode(root, newNode);
    }
  };

  this.search = function(key) {
    // search for key and return true if found, false otherwise
    return searchNode(root, key);
  };

  this.inOrderTraverse = function(callback) {
    // visit all nodes of the tree using in-order traversal
    // call callback with each key encountered
    inOrderTraverseNode(root, callback);
  };

  this.preOrderTraverse = function(callback) {
    // visit all nodes of the tree using pre-order traversal
    // call callback with each key encountered
    preOrderTraverseNode(root, callback);
  };

  this.postOrderTraverse = function(callback) {
    // visit all nodes of the tree using post-order traversal
    // call callback with each key encountered
    postOrderTraverseNode(root, callback);
  };

  this.min = function() {
    // return the minimum key in the tree
    return minNode(root);
  };

  this.max = function() {
    // return the maximum key in the tree
    return maxNode(root);
  };

  this.remove = function(key) {
    // removes the key from the tree
    root = removeNode(root, key)
  };

  this.print = function() {
    function print(node) {
      // check if not is not null
      if (node !== null) {
        // text for left child
        var leftChild = node.left !== null ? node.left.key : "None";
        // text for right child
        var rightChild = node.right !== null ? node.right.key : "None";
        // print output
        console.log(leftChild + " <-- " + node.key + " --> " + rightChild);
        // traverse left
        print(node.left);
        // traverse right
        print(node.right);
      }
    }
    console.log("===tree===");
    print(root);
    console.log("==========");
  };
}

// Dictionary class for use with Graph
function Dictionary() {
  var items = {};

  // pair constructor
  this.ValuePair = function(key, value) {
    this.key = key;
    this.value = value;
    this.toString = function(){
      return `[#${this.key}: ${this.value}]`;
    }
  }

  this.defaultToString = function(item) {
    if (item === null) {
      return "NULL";
    }
    else if (item === undefined) {
      return "UNDEFINED";
    }
    else if (typeof item === "string" || item instanceof String) {
      return `${item}`;
    }
    return item.toString();
  };

  this.set = function(key, value) {
    if (key != null && value != null) {
      const itemKey = this.defaultToString(key);
      items[itemKey] = new this.ValuePair(key, value);
      return true;
    }
    return false;
  };

  this.delete = function(key) {
    if (this.has(key)) {
      const itemKey = this.defaultToString(key);
      delete items[itemKey];
      return true;
    }
    return false;
  };

  this.has = function(key) {
    return items[this.defaultToString(key)] !== undefined;
  };

  this.get = function(key) {
    const valueKey = items[this.defaultToString(key)];
    return valueKey === undefined ? undefined : valueKey.value;
  };

  this.clear = function() {
    items = {};
  };

  this.size = function() {
    return Object.keys(items).length;
  };

  this.keys = function() {
    return Object.keys(items);
  };

  this.values = function() {
    return Object.values(items);
  };

  this.getItems = function() {
    return items;
  };
}

// Queue class for BFS
function Queue() {
  var items = [];

  this.enqueue = function(element) {
    items.push(element);
  }
  this.dequeue = function() {
    if (this.isEmpty()) {
      return undefined;
    }
    return items.shift();
  }
  this.peek = function() {
    if (this.isEmpty()) {
      return undefined;
    }
    return items[0];
  }
  this.isEmpty = function() {
    return items.length === 0;
  }
  this.clear = function() {
    items.length = 0;
    console.log("Queue cleared.");
  }
  this.size = function() {
    return items.length;
  }
}

// Stack class for DFS
function Stack() {
  var items = [];

  this.push = function(element) {
    items.push(element);
  }
  this.pop = function() {
    if (items.length === 0) {
      return undefined;
    }

    return items.pop();
  }
  this.peek = function() {
    return items[items.length - 1];
  }
  this.isEmpty = function() {
    return items.length === 0;
  }
  this.clear = function() {
    items.length = 0;
    console.log("Stack cleared.");
  }
  this.size = function() {
    return items.length;
  }
}

function Graph() {
  var vertices = [];
  var adjList = new Dictionary();

  this.addVertex = function(v) {
    vertices.push(v);
    adjList.set(v, []);
  };

  this.addEdge = function(v, w) {
    adjList.get(v).push(w);
    adjList.get(w).push(v);
  };

  this.toString = function() {
    var s = '';
    for (var i = 0; i < vertices.length; i++) {
      s += vertices[i] + ' -> ';
      var neighbors = adjList.get(vertices[i]);
      for (var j = 0; j < neighbors.length; j++) {
        s += neighbors[j] + ' ';
      }
      s += '\n';
    }
    return s;
  };

  // BFS/DFS helper function
  var initializeColor = function() {
    var color = [];
    for (var i = 0; i < vertices.length; i++) {
      color[vertices[i]] = 'white';
    }
    return color;
  };

  this.bfs = function(v, callback) {
    var color = initializeColor();
    queue = new Queue();
    queue.enqueue(v);

    while (!queue.isEmpty()) {
      var u = queue.dequeue();
      var neighbors = adjList.get(u);
      color[u] = 'grey';
      for (var i = 0; i < neighbors.length; i++) {
        var w = neighbors[i];
        if (color[w] === 'white') {
          color[w] = 'grey';
          queue.enqueue(w);
        }
      }
      color[u] = 'black';
      if (callback) {
        callback(u);
      }
    }
  };

  this.dfs = function(callback) {
    var color = initializeColor();

    for (var i = 0; i < vertices.length; i++) {
      if (color[vertices[i]] === 'white') {
        dfsVisit(vertices[i], color, callback);
      }
    }
  };

  var dfsVisit = function(u, color, callback) {
    color[u] = 'grey';
    if (callback) {
      callback(u);
    }
    var neighbors = adjList.get(u);
    for (var i = 0; i < neighbors.length; i++) {
      var w = neighbors[i];
      if (color[w] === 'white') {
        dfsVisit(w, color, callback);
      }
    }
    color[u] = 'black';
  };

  // helper for Dijkstra's algorithm
  var minDistance = function(dist, visited) {
    var min = Infinity;
    var minIndex = -1;

    for (var v = 0; v < dist.length; v++) {
      if (visited[v] == false && dist[v] <= min) {
        min = dist[v];
        minIndex = v;
      }
    }
    return minIndex;
  };

  // Dijkstra's shortest path algorithm
  this.dijkstra = function(src) {
    var dist = [];
    var visited = [];
    var length = graphMatrix.length;

    for (var i = 0; i < length; i++) {
      dist[i] = Infinity;
      visited[i] = false;
    }  

    dist[src] = 0;

    for (var i = 0; i < length - 1; i++) {
      var u = minDistance(dist, visited);
      visited[u] = true;

      for (var v = 0; v < length; v++) {
        if (!visited[v] && graphMatrix[u][v] != 0 &&
          dist[u] != Infinity &&
          dist[u] + graphMatrix[u][v] < dist[v]) {
            dist[v] = dist[u] + graphMatrix[u][v];
        }
      }
    }
    return dist;
  };
}
