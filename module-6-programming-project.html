// 1. Implement the ArrayList using the prototype.

function ArrayList() {
  this.array = [];
// property to avoid repeatedly printing sorted array when sort functions are called multiple times
  this.sorted = false;
}

ArrayList.prototype.insert = function(item) {
  this.array.push(item);
  this.sorted = false;
}

ArrayList.prototype.toString = function() {
  return this.array.join();
}

ArrayList.prototype.quickSort = function() {
  quick(this.array, 0, this.array.length - 1);
  this.sorted = true;
}

ArrayList.prototype.sequentialSearch = function(value) {
  const DOES_NOT_EXIST = -1;

  for (let i = 0; i < this.array.length; i++) {
    if (this.array[i] === value)
    return i;
  }
  return DOES_NOT_EXIST;
}

ArrayList.prototype.binarySearch = function(value) {
// Only apply sorting algorithm if array has not already been sorted
  if (!this.sorted) {
    this.quickSort();
// Print message after first sort so user is aware the order changed
    console.log("Quick Sort Algorithm applied to array");
    console.log(this.array.toString());
  }

  var low = 0,
  high = this.array.length - 1,
  mid, element;

  while (low <= high) {
    mid = Math.floor((low + high) / 2);
    element = this.array[mid];
    if (element < value) {
      low = mid + 1;
    } else if (element > value) {
      high = mid - 1;
    } else {
      return mid;
    }
  }
  return -1;
}



// 2. Complete the createNonSortedRandomArray(size) below by returning an
//    ArrayList with the numbers 1, 2, ..., size in random order.
//    NOTE: there are multiple ways to achieve this.

function createNonSortedRandomArray(size) {
  var list = new ArrayList();

  for (let i = 1; i <= size; i++) {
    list.insert(i);
  }

// Take two numbers from the array and compare them
// Generate random number between -0.5 and 0.5 for each comparison
// If value is positive, swap the position, otherwise they remain in the same order
  list.array.sort(() => Math.random() - 0.5);
  return list;
}

// 3. Implement the Quick Sort algorithm and test your code with the function
//    you wrote for (2).

var swap = function(array, a, b) {
  [array[a], array[b]] = [array[b], array[a]];
}

var quick = function(array, left, right) {
  var index;

  if (array.length > 1) {
    index = partition(array, left, right);

    if (left < index - 1) {
      quick(array, left, index - 1);
    }

    if (index < right) {
      quick(array, index, right);
    }
  }
}

var partition = function(array, left, right) {
  var pivot = array[Math.floor((right + left) / 2)],
  i = left,
  j = right;

  while (i <= j) {
    while (array[i] < pivot) {
      i++;
    }
    while (array[j] > pivot) {
      j--;
    }
    if (i <= j) {
      swap(array, i, j);
      i++;
      j--;
    }
  }
  return i;
}
