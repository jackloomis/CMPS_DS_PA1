// 1. Implement factorial using a recursive function and test your code.

function recursiveFactorial(num) {
  let product;
  if (num <= 1) {
    product = 1;
  } else {
    product = num * recursiveFactorial(num - 1);
  }
  return product;
}

console.log("Recursive Factorials");
console.log("The factorial of 0 is " + recursiveFactorial(0));
console.log("The factorial of 1 is " + recursiveFactorial(1));
console.log("The factorial of 4 is " + recursiveFactorial(4));



// 2. Implement a function that returns the complete fibonacci sequence in an
//    array for a given number.

function fibonacciArray(end) {
  let current = 0;
  let next = 1;
  const numArray = [current, next];

  function recurse(current, next) {
    let sum = current + next;

    if (sum > end) {
      return;
    } else {
      numArray.push(sum);
      recurse(next, sum);
    }
  }
  recurse(current, next);
  return numArray;
}

console.log("Fibonacci Sequence");
console.log("Fibonacci through 55: " + fibonacciArray(55));



// 3. Implement finding the longest common subsequence using dynamic
//    programming. Test your code.

function lcs(wordX, wordY) {
  var m = wordX.length,
  n = wordY.length,
  l = [],
  solution = [],
  i, j, a, b;

  for (i = 0; i <= m; ++i) {
    l[i] = [];
    solution[i] = [];
    for (j = 0; j <= n; ++j) {
      l[i][j] = 0;
      solution[i][j] = '0';
    }
  }

  for (i = 0; i <= m; i++) {
    for (j = 0; j <= n; j++) {
      if (i == 0 || j == 0) {
        l[i][j] = 0;
      } else if (wordX[i - 1] == wordY[j - 1]) {
        l[i][j] = l[i - 1][j - 1] + 1;
        solution[i][j] = 'diagonal';
      } else {
        a = l[i - 1][j];
        b = l[i][j - 1];
        l[i][j] = (a > b) ? a : b;
        solution[i][j] = (l[i][j] == l[i - 1][j]) ? 'top' : 'left';
      }
    }
  }
  printSolution(solution, l, wordX, wordY, m, n);
  return l[m][n];
}

function printSolution(solution, l, wordX, wordY, m, n) {
  var a = m, b = n, i, j,
  x = solution[a][b],
  answer = '';

  while (x !== '0') {
    if (solution[a][b] === 'diagonal') {
      answer = wordX[a - 1] + answer;
      a--;
      b--;
    } else if (solution[a][b] === 'left') {
      b--;
    } else if (solution[a][b] === 'top') {
      a--;
    }
    x = solution[a][b];
  }
  console.log('LCS: ' + answer);
}

// 4. Solve the problem of summing all the numbers in an array using
//    imperative style.

function imperativeSumArr(arr) {
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
  }
  return sum;
}

// 5. Solve the problem of summing all the numbers in an array using
//    functional style.

function functionalSumArr(arr) {
  return arr.reduce(function(a, b){
    return a + b;
  })
}

console.log("Longest Collatz Sequence");


 // Function to detemine Collatz Sequence of a given number
function collatzSequence(num) {
  const sequenceArr = [num];

  function recurse(current) {
    if (current === 1) {
    return;

    } else if (current % 2 !== 0) {
      let nextNum = (current * 3) + 1;
      sequenceArr.push(nextNum);
      recurse(nextNum);

    } else if (current % 2 === 0) {
      let nextNum = current / 2;
      sequenceArr.push(nextNum);
      recurse(nextNum);
    }
  }
  recurse(num);
  return sequenceArr;
}



// Recursive caller for collatzSequence() to check each integer and store the length/starting number of the longest chain
function collatzCaller(num) {
  let longestSequence = 1;
  let startingNumber = 1;

  if (num > 1000000 || num < 1) {
    console.log("ERROR: Max number must be between 1 and 1,000,000");
    return;
  }


  function recurse(current) {
    if (current > num) {
      return;
    }

    let sequenceArr = collatzSequence(current);
    if (sequenceArr.length > longestSequence) {
      longestSequence = sequenceArr.length;
      startingNumber = current;
    }
    recurse(current + 1);
  }
  recurse(1);
  console.log("Max number: " + num);
  console.log("Starting number of longest sequence: " + startingNumber);
  console.log("Length of longest sequence: " + longestSequence);
}

// I initially wrote the functions recursively for practice but it causes a stack overflow with large numbers
// Below are the functions rewritten with loops so they can check numbers up to the max without an error

function collatzSequenceLoop(num) {
  const sequenceArr = [num];

  while (num > 1) {
    if (num % 2 === 0) {
      num = num / 2;
    } else {
      num = (num * 3) + 1;
    }
    sequenceArr.push(num);
  }
  return sequenceArr;
}



function collatzCallerLoop(num) {
  let longestSequence = 1;
  let startingNumber = 1;

  if (num > 1000000 || num < 1) {
    console.log("ERROR: Max number must be between 1 and 1,000,000");
    return;
  }

  for (let current = 1; current <= num; current++) {
    let sequenceArr = collatzSequenceLoop(current);

    if (sequenceArr.length > longestSequence) {
      longestSequence = sequenceArr.length;
      startingNumber = current;
    }
  }
  console.log("Max number: " + num);
  console.log("Starting number of longest sequence: " + startingNumber);
  console.log("Length of longest sequence: " + longestSequence);
}
