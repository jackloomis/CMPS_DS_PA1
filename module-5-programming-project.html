// 1. Implement the tree data structure using the prototype (see below). Note
//    that we have helper functions that we have to deal with, and we simply
//    make them part of the prototype but prepend them with _, e.g., _insertNode
//    below. This is a common convention/solution. Programmers using a tree
//    object are not supposed to use _ methods (or properties) directly. Run

function Node(key) {
  this.key = key;
  this.left = null;
  this.right = null
}

function BinarySearchTree() {
  // the root node
  this.root = null;
}

// helper functions
BinarySearchTree.prototype._insertNode = function(node, newNode) {
  // node is the node we want to insert into
  // newNode is the node we want to insert
  if (newNode.key < node.key) {
    // go to left
    if (node.left === null) {
      // no left node yet so assign
      node.left = newNode;
    }
    else {
      // move down tree and repeat
      this._insertNode(node.left, newNode);
    }
  }
  else {
    // go to right
    if (node.right === null) {
      // no right node yet so assign
      node.right = newNode;
    }
    else {
      // move down tree and repeat
      this._insertNode(node.right, newNode);
    }
  }
}

BinarySearchTree.prototype._searchNode = function(node, key) {
  if (node == null) {
    return false;
  }
  if (key < node.key) {
    return this._searchNode(node.left, key);
  }
  else if (key > node.key) {
    return this._searchNode(node.right, key);
  }
  else {
    return true;
  }
}

BinarySearchTree.prototype._removeNode = function(node, key) {
  if (node == null) {
    return null;
  }
  if (key < node.key) {
    node.left = this._removeNode(node.left, key);
    return node;
  }
  else if (key > node.key) {
    node.right = this._removeNode(node.right, key);
    return node;
  }
  else {
    // case 1
    if (node.left == null && node.right == null) {
      node = null;
      return node;
    }
    // case 2
    if (node.left == null) {
      node = node.right;
      return node;
    }
    else if (node.right == null) {
      node = node.left;
      return node;
    }
    // case 3
    const aux = this._minNode(node.right);
    node.key = aux.key;
    node.right = this._removeNode(node.right, aux.key);
    return node;
  }
}

BinarySearchTree.prototype._minNode = function(node) {
  let current = node;
  while (current != null && current.left != null) {
    current = current.left;
  }
  return current;
}

BinarySearchTree.prototype._maxNode = function(node) {
  let current = node;
  while (current != null && current.right != null) {
    current = current.right;
  }
  return current;
}

BinarySearchTree.prototype._inOrderTraverseNode = function(node, callback) {
  if (node != null) {
    this._inOrderTraverseNode(node.left, callback);
    callback(node.key);
    this._inOrderTraverseNode(node.right, callback);
  }
}

BinarySearchTree.prototype._preOrderTraverseNode = function(node, callback) {
  if (node != null) {
    callback(node.key);
    this._preOrderTraverseNode(node.left, callback);
    this._preOrderTraverseNode(node.right, callback);
  }
}

BinarySearchTree.prototype._postOrderTraverseNode = function(node, callback) {
  if (node != null) {
    this._postOrderTraverseNode(node.left, callback);
    this._postOrderTraverseNode(node.right, callback);
    callback(node.key);
  }
}

BinarySearchTree.prototype.insert = function(key) {
  // insert new key in the tree
  var newNode = new Node(key);
  if (this.root === null) {
    // no nodes yet
    this.root = newNode;
  }
  else {
    // find insert location through insertNode
    this._insertNode(this.root, newNode);
  }
}

BinarySearchTree.prototype.search = function(key) {
  // search for key and return true if found, false otherwise
  return this._searchNode(this.root, key);
}

BinarySearchTree.prototype.remove = function(key) {
  // removes the key from the tree
  this.root = this._removeNode(this.root, key)
}

BinarySearchTree.prototype.min = function() {
  // return the minimum key in the tree
  return this._minNode(this.root);
}

BinarySearchTree.prototype.max = function() {
  // return the maximum key in the tree
  return this._maxNode(this.root);
}

BinarySearchTree.prototype.inOrderTraverse = function(callback) {
  // visit all nodes of the tree using in-order traversal
  // call callback with each key encountered
  this._inOrderTraverseNode(this.root, callback);
}

BinarySearchTree.prototype.preOrderTraverse = function(callback) {
  // visit all nodes of the tree using pre-order traversal
  // call callback with each key encountered
  this._preOrderTraverseNode(this.root, callback);
}

BinarySearchTree.prototype.postOrderTraverse = function(callback) {
  // visit all nodes of the tree using post-order traversal
  // call callback with each key encountered
  this._postOrderTraverseNode(this.root, callback);
}

BinarySearchTree.prototype.print = function() {
  function print(node) {
    // check if not is not null
    if (node !== null) {
      // text for left child
      var leftChild = node.left !== null ? node.left.key : "None";
      // text for right child
      var rightChild = node.right !== null ? node.right.key : "None";
      // print output
      console.log(leftChild + " <-- " + node.key + " --> " + rightChild);
      // traverse left
      print(node.left);
      // traverse right
      print(node.right);
    }
  }
  console.log("===tree===");
  print(this.root);
  console.log("==========");
}

// Dictionary prototype class for use with Graph structure
function Dictionary() {
  this.items = {};
}

Dictionary.prototype.ValuePair = function(key, value) {
  this.key = key;
  this.value = value;
  this.toString = function(){
    return `[#${this.key}: ${this.value}]`;
  }
};

Dictionary.prototype.defaultToString = function(item) {
  if (item === null) {
    return "NULL";
  }
  else if (item === undefined) {
    return "UNDEFINED";
  }
  else if (typeof item === "string" || item instanceof String) {
    return `${item}`;
  }
  return item.toString();
};

Dictionary.prototype.set = function(key, value) {
  if (key !== null && value !== null) {
    const itemKey = this.defaultToString(key);
    this.items[itemKey] = new this.ValuePair(key, value);
    return true;
  }
  return false;
};

Dictionary.prototype.delete = function(key) {
  if (this.has(key)) {
    const itemKey = this.defaultToString(key);
    delete this.items[itemKey];
    return true;
  }
  return false;
};

Dictionary.prototype.has = function(key) {
  return this.items[this.defaultToString(key)] !== undefined;
};

Dictionary.prototype.get = function(key) {
  const valueKey = this.items[this.defaultToString(key)];
  return valueKey === undefined ? undefined : valueKey.value;
};

Dictionary.prototype.clear = function() {
  this.items = {};
};

Dictionary.prototype.size = function() {
  return Object.keys(this.items).length;
};

Dictionary.prototype.keys = function() {
  return Object.keys(this.items);
};

Dictionary.prototype.values = function() {
  return Object.values(this.items);
};

Dictionary.prototype.getItems = function() {
  return this.items;
};

Dictionary.prototype.print = function() {
  this.values().forEach(pair => console.log(pair.toString()));
};


function Graph() {
  this.vertices = [];
  this.adjList = new Dictionary();
}

Graph.prototype.addVertex = function(v) {
  this.vertices.push(v);
  this.adjList.set(v, []);
}

Graph.prototype.addEdge = function(v, w) {
  this.adjList.get(v).push(w);
  this.adjList.get(w).push(v);
}

Graph.prototype.toString = function() {
  var s = '';
  for (var i = 0; i < this.vertices.length; i++) {
    s += this.vertices[i] + ' -> ';
    var neighbors = this.adjList.get(this.vertices[i]);
    for (var j = 0; j < neighbors.length; j++) {
      s += neighbors[j] + ' ';
    }
    s += '\n';
  }
  return s;
}

//  helper for Prim's algorithm
var minKey = function(key, visited) {
  var min = Infinity;
  var minIndex = -1;

  for (var v = 0; v < key.length; v++) {
    if (visited[v] == false && key[v] <= min) {
      min = key[v];
      minIndex = v;
    }
  }
  return minIndex;
};

function prim(graph) {
  var parent = [], key = [], visited = [];
  length = graph.length;

  for (i = 0; i < length; i++) {
    key[i] = Infinity;
    visited[i] = false;
  }

  key[0] = 0;
  parent[0] = -1;

  for (i = 0; i < length - 1; i++) {
    var u = minKey(key, visited);
    visited[u] = true;

    for (var v = 0; v < length; v++) {
      if (graph[u][v] && visited[v] == false
      && graph[u][v] < key[v]) {
      parent[v] = u;
      key[v] = graph[u][v];
      }
    }
  }
  return parent;
};
