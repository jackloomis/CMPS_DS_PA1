// 1. Finish the implemention of the set data structure below. Note that this
//    implementation does not use the prototype (see homework).

function Set() {
  var items = {}; // note that this is an object instead of an array

  this.add = function(value) {
    if (!this.has(value)) {
      items[value] = value;
    }
  };

  this.delete = function(value) {
    if (this.has(value)) {
      delete items[value];
      return true;
    }
    return false;
  };

  this.has = function(value) {
    return Object.prototype.hasOwnProperty.call(items, value);
  };

  this.clear = function() {
    items = {};
  };

  this.size = function() {
    return Object.keys(items).length;
  };

  this.values = function() {
    return Object.values(items);
  };

  this.union = function(otherSet) {
    const unionSet = new Set();
    this.values().forEach(value => unionSet.add(value));
    otherSet.values().forEach(value => unionSet.add(value));
    return unionSet;
  };

  this.intersection = function(otherSet) {
    const intersectSet = new Set();
    const values = this.values();
    const otherValues = otherSet.values();
    let biggerSet = values;
    let smallerSet = otherValues;

    if (otherValues.length - values.length < 0) {
      biggerSet = otherValues;
      smallerSet = values;
    }
    for (let i = 0; i < smallerSet.length; i++) {
      if (biggerSet.includes(smallerSet[i])) {
        intersectSet.add(smallerSet[i]);
      }
    }
    return intersectSet;
  };

  this.difference = function(otherSet) {
    const differenceSet = new Set();
    this.values().forEach(value => {
      if (!otherSet.has(value)) {
        differenceSet.add(value);
      }
    });
    return differenceSet;
  };

  this.isSubsetOf = function(otherSet) {
    if (this.size() > otherSet.size()) {
      return false;
    }
    let isSubset = true;
    this.values().forEach(value => {
      if (!otherSet.has(value)) {
        isSubset = false;
      }
    });
    return isSubset;
  };
}

// 1. Finish the implemention of the dictionary data structure below. Note that
//    this implementation does not use the prototype (see homework).
//    NOTE: This is very similar to the set data structure.

function Dictionary() {
  // store all elements in the items object
  var items = {};

  // pair constructor
  this.ValuePair = function(key, value) {
    this.key = key;
    this.value = value;
    this.toString = function(){
      return `[#${this.key}: ${this.value}]`;
    }
  }

  this.defaultToString = function(item) {
    if (item === null) {
      return "NULL";
    }
    else if (item === undefined) {
      return "UNDEFINED";
    }
    else if (typeof item === "string" || item instanceof String) {
      return `${item}`;
    }
    return item.toString();
  };

  this.set = function(key, value) {
    if (key !== null && value !== null) {
      const itemKey = this.defaultToString(key);
      items[itemKey] = new this.ValuePair(key, value);
      return true;
    }
    return false;
  };

  this.delete = function(key) {
    if (this.has(key)) {
      const itemKey = this.defaultToString(key);
      delete items[itemKey];
      return true;
    }
    return false;
  };

  this.has = function(key) {
    return items[this.defaultToString(key)] !== undefined;
  };

  this.get = function(key) {
    const valueKey = items[this.defaultToString(key)];
    return valueKey === undefined ? undefined : valueKey.value;
  };

  this.clear = function() {
    items = {};
  };

  this.size = function() {
    return Object.keys(items).length;
  };

  this.keys = function() {
    return Object.keys(items);
  };

  this.values = function() {
    return Object.values(items);
  };

  this.getItems = function() {
    return items;
  };
}

function ValuePair(key, value) {
  this.key = key;
  this.value = value;
  this.toString = function() {
    return "[" + this.key + " - " + this.value + "]";
  };
};

function Node(element) {
  this.element = element;
  this.next = null;
}

function LinkedList() {
  this.length = 0;
  this.head = null;
}

LinkedList.prototype.append = function(element) {
  var node = new Node(element);
  if (this.head === null) {
    this.head = node;
  }
  else {
    var tmp = this.head;
    while (tmp.next !== null) {
      tmp = tmp.next;
    }
    tmp.next = node;
  }
  this.length++;
};

LinkedList.prototype.insert = function(position, element) {
  var node = new Node(element);
  if (position === 0) {
    var oldHead = this.head;
    this.head = node;
    this.head.next = oldHead;
  }
  else {
    var tmp = this.head;
    for (var i = 0; i < position-1; i++) {
      tmp = tmp.next;
    }
    node.next = tmp.next;
    tmp.next = node;
  }
  this.length++;
};

LinkedList.prototype.removeAt = function(position) {
  var element = null;
  if (position === 0) {
    element = this.head.element;
    this.head = this.head.next;
  }
  else {
    var tmp = this.head;
    for (var i = 0; i < position-1; i++) {
      tmp = tmp.next;
    }
    element = tmp.next.element;
    var prev = tmp;
    var middle = tmp.next;
    var next = middle.next;
    prev.next = next;
  }
  this.length--;
  return element;
};

LinkedList.prototype.remove = function(element) {
  var position = this.indexOf(element);
  return this.removeAt(position);
};

LinkedList.prototype.indexOf = function(element) {
  var tmp = this.head;
  for (var i = 0; i < this.length; i++) {
    if (tmp.element === element) {
      return i;
    }
    tmp = tmp.next;
  }
  return -1;
};

LinkedList.prototype.isEmpty = function() {
  return this.length === 0;
};

LinkedList.prototype.size = function() {
  var length = 0;
  var tmp = this.head;
  while (tmp !== null) {
    length++;
    tmp = tmp.next;
  }
  return length;
};

LinkedList.prototype.getHead = function() {
  return this.head;
}

LinkedList.prototype.toString = function() {
  var current = this.head;
  var string = "List: ";
  while (current) {
    string += current.element + (current.next ? " -> " : "");
    current = current.next;
  }
  return string;
};

LinkedList.prototype.print = function() {
  console.log(this.toString());
};

// 1. Finish the implemention of the hash table data structure below. Note that
//    this implementation does not use the prototype (see project). You also
//    do not yet have to resolve collisions (see question 3).

function HashTable() {
  // store all elements in the table array
  var table = [];

  // define hash function
  function loseloseHashCode(key) {
    var hash = 0;
    for (var i = 0; i < key.length; i++) {
      hash += key.charCodeAt(i);
    }
    return hash % 37;
  }

  this.put = function(key, value) {
    if (key !== undefined && value !== undefined) {
      const position = loseloseHashCode(key);
      table[position] = new ValuePair(key, value);
      return true;
    }
    return false;
  };

  this.remove = function(key) {
    const position = loseloseHashCode(key);
    const valuePair = table[position];
    if (valuePair !== undefined) {
      delete table[position];
      return true;
    }
    return false;
  };

  this.get = function(key) {
    const valuePair = table[loseloseHashCode(key)];
    return valuePair === undefined ? undefined : valuePair.value;
  };

  this.print = function() {
    // print the content of the hash table
    for (var i = 0; i < table.length; i++) {
      if (table[i] !== undefined) {
        console.log(i + ": " + table[i]);
      }
    }
  };
}

// 3. Modify your implementation to use separate chaining (for linked list, see
//    above) for resolving collisions. We also need ValuePair, which is provided
//    above.

function separateChainingHashTable() {
  var table = [];

    // define hash function
  function loseloseHashCode(key) {
    var hash = 0;
    for (var i = 0; i < key.length; i++) {
      hash += key.charCodeAt(i);
    }
    return hash % 37;
  };

  this.put = function(key, value) {
    if (key !== null && value !== null) {
      const position = loseloseHashCode(key);
      if (table[position] === undefined) {
        table[position] = new LinkedList();
      }
      table[position].append(new ValuePair(key, value));
      return true;
    }
    return false;
  };

  this.get = function(key) {
    const position = loseloseHashCode(key);
    const linkedList = table[position]; 
    if (linkedList !== undefined && !linkedList.isEmpty()) {
      let current = linkedList.getHead();   
      while (current !== null) {
        if (current.element.key === key) {
          return current.element.value;
        }
        current = current.next;
      } 
    } 
    return undefined;
  };

  this.remove = function(key) {
    const position = loseloseHashCode(key);
    const linkedList = table[position];
    if (linkedList !== undefined && !linkedList.isEmpty()) {
      let current = linkedList.getHead();
      while (current !== null) {
        if (current.element.key === key) {
          linkedList.remove(current.element);
          if (linkedList.isEmpty()) {
            delete table[position];
          }
          return true;
        }
        current = current.next;
      }
    }
    return false;
  };

  this.print = function() {
    for (var i = 0; i < table.length; i++) {
      if (table[i] !== undefined) {
        console.log(i + ": " + table[i]);
      }
    }
  };
}
