// 1. Write a function to check if an array contains a specific number at the
//    first or last position of the array.
function checkForNumber(arr, num) {
  if (arr[0] === num || arr[arr.length - 1] === num) {
    return true;
  }
  else {
    return false;
  }
}
// NOTE: all these tests should eventually print true.

// 1. Add methods to the following object to calculate the circumference

function Triangle(side) {
  this.side = side;
}

Triangle.prototype.getCircumference = function() {
  return this.side * 3;
}

Triangle.prototype.getArea = function() {
// Since all sides are the same length, use formula for area of an equilateral triangle
  return (Math.sqrt(3)/4) * (this.side ** 2);
}

// ... add getCircumference and getArea methods ...
// HINT: use the prototype

var triangle = new Triangle(5);
console.log("The circumference for the triangle is " + triangle.getCircumference());
console.log("The area for the triangle is " + triangle.getArea());

// 1. Check the weather forecast for the next 5 days and store the expected

var may14th = 52;
var may15th = 68;
var may16th = 78;
var may17th = 84;
var may18th = 91;

function avgTemp() {
  return (may14th + may15th + may16th + may17th + may18th) / 5;
}

console.log(avgTemp());

// 2. Solve the same problem as in (1) but store the temperatures in an array.

var weeklyTemps = [52, 68, 78, 84, 91];

function arrayAvgTemp() {
  var sum = 0;
  for (var i = 0; i < weeklyTemps.length; i++) {
    sum += weeklyTemps[i];
  }
  return sum / 5;
}

console.log(arrayAvgTemp());

// 1. Sum all the elements in the two-dimensional array below. Print the

var arr = [[1, 2, 3],

function calculateSum(arr) {
  var sum = 0;
  for (var i = 0; i < arr.length; i++) {
    for (var j = 0; j < arr[i].length; j++) {
      sum += arr[i][j];
    }     
  }
  return sum;
}

// 3. Select all the nonnegative numbers from the numbers array and store them

  for (var i = 0; i < arr.length; i++) {
    if (arr[i] >= 0) {
      positiveArray.push(arr[i]);
    }
  }
  return positiveArray;
}

  squaredArray = [];

  }
  return squaredArray;
}
